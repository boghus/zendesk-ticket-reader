<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zendesk Ticket Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      background: #f8f9fa;
      color: #1f2937;
    }

    header {
      background: #03363d;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header .badge {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .content { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .field {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .field-value {
      font-size: 14px;
      color: #111827;
      word-break: break-word;
      line-height: 1.4;
    }

    .field-value.empty {
      color: #9ca3af;
      font-style: italic;
      font-size: 13px;
    }

    .priority-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .priority-urgent  { background: #fee2e2; color: #dc2626; }
    .priority-high    { background: #fef3c7; color: #d97706; }
    .priority-normal  { background: #dbeafe; color: #2563eb; }
    .priority-low     { background: #f3f4f6; color: #6b7280; }

    #status {
      text-align: center;
      padding: 24px 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    #status.error { color: #dc2626; }

    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #03363d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-row {
      display: flex;
      gap: 8px;
      margin: 0 16px 16px;
    }

    .btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #03363d;
      color: white;
    }
    .btn-primary:hover { background: #024a53; }

    .btn-secondary {
      background: white;
      color: #03363d;
      border: 1px solid #03363d;
    }
    .btn-secondary:hover { background: #f0fafa; }

    .btn-secondary.copied {
      background: #d1fae5;
      color: #065f46;
      border-color: #065f46;
    }
  </style>
</head>
<body>
  <header>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <h1>Zendesk Ticket Reader</h1>
    <span class="badge" id="ticket-id">—</span>
  </header>

  <div id="status">
    <div class="spinner"></div>
    Leyendo ticket...
  </div>

  <div class="content" id="data-content" style="display:none">
    <div class="field">
      <div class="field-label">Asunto</div>
      <div class="field-value" id="field-subject"></div>
    </div>
    <div class="field">
      <div class="field-label">Prioridad</div>
      <div class="field-value" id="field-priority"></div>
    </div>
    <div class="field">
      <div class="field-label">Fecha de vencimiento</div>
      <div class="field-value" id="field-due-date"></div>
    </div>
  </div>

  <div class="btn-row" id="btn-row" style="display:none">
    <button class="btn btn-primary" id="refresh-btn">Actualizar</button>
    <button class="btn btn-secondary" id="copy-btn">Copiar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
