name: Sincronización main → develop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.ref_name, 'sync/')

    runs-on: ubuntu-latest

    env:
      HAS_CONFLICTS: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Verificar que develop existe en remoto
        run: |
          git fetch origin

          git checkout -B sync/main-to-develop origin/develop

          if ! git merge origin/main \
            --no-ff \
            --no-edit; then

            echo "HAS_CONFLICTS=true" >> $GITHUB_ENV
          fi

      - name: Preparar rama de sincronización
        run: |
          if git diff --quiet origin/develop..HEAD; then
            echo "No se detectaron cambios"
            exit 0
          fi

      - name: Publicar rama de sincronización
        run: |
          git push origin sync/main-to-develop --force-with-lease

      - name: Crear o actualizar PR de sincronización
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          PR_BODY=$(cat <<EOF
          ## 📦 Descripción
          PR automático generado para sincronizar cambios desde \`main\` hacia \`develop\`.

          ## 🔄 Objetivo
          Mantener \`develop\` alineado con los cambios ya desplegados o integrados en producción.

          ## ⚠️ Estaus de Conflictos
          $(if [ "$HAS_CONFLICTS" = "true" ]; then
            echo "Conflictos detectados. Por favor, resuélvelos manualmente."
          else
            echo "Sin conflictos detectados. PR listo para revisión y merge automático."
          fi)

          ## 🤖 Automatización
          Este PR fue generado automáticamente mediante GitHub Actions.
          EOF
          )

          PR_TITLE="Sincronizacion de cambios de main a develop"

          gh pr create \
            --base develop \
            --head sync/main-to-develop \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
          || gh pr edit sync/main-to-develop \
            --title "$PR_TITLE" \
            --body "$PR_BODY"
