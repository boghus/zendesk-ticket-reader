name: Sincronización main → develop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.ref_name, 'sync/')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Actualizar referencias
        run: git fetch origin

      - name: Verificar si hay conflictos
        run: |
          BRANCH="sync/main-to-develop"

          git checkout -B "$BRANCH" origin/develop

          if git merge origin/main --no-ff --no-edit; then
            echo "HAS_CONFLICTS=false" >> $GITHUB_ENV
          else
            echo "HAS_CONFLICTS=true" >> $GITHUB_ENV
            git merge --abort || true
            git checkout -B "$BRANCH" origin/main
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Publicar rama de sincronización
        run: |
          git push origin "$BRANCH" --force-with-lease

      - name: Crear o actualizar PR de sincronización
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY=$(cat <<EOF
          ## 📦 Descripción
          PR automático generado para sincronizar cambios desde \`main\` hacia \`develop\`.

          ## 🔄 Objetivo
          Mantener \`develop\` alineado con los cambios ya desplegados o integrados en producción.

          ## ⚠️ Estaus de Conflictos
          $(if [ "$HAS_CONFLICTS" = "true" ]; then
            echo "Conflictos detectados. Por favor, resuélvelos manualmente."
          else
            echo "Sin conflictos detectados. PR listo para revisión y merge automático."
          fi)

          ## 🤖 Automatización
          Este PR fue generado automáticamente mediante GitHub Actions.
          EOF
          )

          PR_TITLE="Sincronizacion de cambios de main a develop"

          if ! gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"; then
            PR_NUMBER=$(gh pr list --head "$BRANCH" --base develop --json number --jq '.[0].number')
            gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body "$PR_BODY"
          fi
