<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket Reader for Zendesk</title>
  <link rel="stylesheet" href="../theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="header-main">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
      </svg>
      <h1>Ticket Reader for Zendesk</h1>
    </div>

    <span class="badge" id="ticket-id">—</span>
  </header>

  <div id="status">
    <div class="spinner"></div>
    Leyendo ticket...
  </div>

  <div class="content" id="data-content" style="display:none">
    <div class="field">
      <div class="field-label">Asunto</div>
      <div class="field-value" id="field-subject"></div>
    </div>
    <div class="field">
      <div class="field-label">Prioridad</div>
      <div class="field-value" id="field-priority"></div>
    </div>
    <div class="field">
      <div class="field-label">Fecha de vencimiento</div>
      <div class="field-value" id="field-due-date"></div>
    </div>
  </div>

  <div class="btn-row" id="btn-row" style="display:none">
    <button class="btn btn-primary" id="refresh-btn">Actualizar!</button>
    <button class="btn btn-secondary" id="copy-btn">Copiar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
